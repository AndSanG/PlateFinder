name: iOS CI/CD Pipeline

on:
  push:
    branches:
      - feat/cicd
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Ruby environment
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0

      # Install Fastlane
      - name: Install Fastlane
        run: gem install fastlane

      # Set up Xcode environment
      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      # Decrypt secrets and set environment variables
      - name: Set up environment variables
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          IOS_DIST_SIGNING_KEY: ${{ secrets.IOS_DIST_SIGNING_KEY }}
          IOS_DIST_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_KEY_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      # Run Fastlane lanes
      - name: Run Fastlane build and upload
        run: fastlane fetch_and_increment_build_number && fastlane load_asc_api_key && fastlane beta